name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    - run: go test ./...
    # The DAP/LSP debugger code is gated behind the debugger build tag;
    # without this second pass its tests never run in CI.
    - run: go test -tags debugger ./...

  # The race detector catches data races the plain test job cannot see
  # (concurrent atoms/futures). Ubuntu-only: it is ~10x slower, and a
  # data race is a logic bug, not an OS-specific one.
  race:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: 1.26.x
    - run: go test -race ./...
    - run: go test -race -tags debugger ./...

  # Smoke-fuzz READ and EVAL: a short run per push that would have caught
  # the phase-2 panics. It mainly re-runs the committed seed corpus plus a
  # little exploration; long fuzzing sessions stay manual/local. A crasher
  # is written under testdata/fuzz/ and committed so it becomes a seed.
  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: 1.26.x
    - run: go test -run='^$' -fuzz='^FuzzReadStr$' -fuzztime=30s ./reader/
    - run: go test -run='^$' -fuzz='^FuzzEval$' -fuzztime=30s .

  # Honest cross-package coverage (-coverpkg), reported not enforced:
  # per-package numbers under-count because the root step-tests exercise
  # lib/core etc. across package boundaries. This just surfaces the trend
  # in the log; it never fails the build.
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: 1.26.x
    - run: |
        go test -coverpkg=./... -coverprofile=cover.out ./...
        go tool cover -func=cover.out | tail -1

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: 1.26.x
    - name: gofmt
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-ed:"
          echo "$unformatted"
          exit 1
        fi
    - name: go vet
      run: go vet ./...
    # Vet the debugger code too: it never compiles in the default build.
    - name: go vet (debugger)
      run: go vet -tags debugger ./...
