name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    - run: go test ./...
    # The DAP/LSP debugger code is gated behind the lispdebug build tag;
    # without this second pass its tests never run in CI.
    - run: go test -tags lispdebug ./...

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: 1.25.x
    - name: gofmt
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-ed:"
          echo "$unformatted"
          exit 1
        fi
    - name: go vet
      run: go vet ./...
    # Vet the debugger code too: it never compiles in the default build.
    - name: go vet (lispdebug)
      run: go vet -tags lispdebug ./...
