name: Lint
on: [push, pull_request]

jobs:
  golangci:
    runs-on: ubuntu-latest
    # Non-blocking for now: golangci-lint findings are surfaced but do not
    # fail the build. Flip this to false once the codebase is clean.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v5
      with:
        go-version: 1.25.x
    - uses: golangci/golangci-lint-action@v7
      with:
        version: latest
