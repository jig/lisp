name: Lint
on: [push, pull_request]

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v5
      with:
        go-version: 1.25.x
    - uses: golangci/golangci-lint-action@v7
      with:
        # Pinned so a new golangci-lint release with extra linters arrives
        # as a Dependabot PR instead of breaking main. The tree is clean
        # at this version (see .golangci.yml for the disabled checks).
        version: v2.12.2
